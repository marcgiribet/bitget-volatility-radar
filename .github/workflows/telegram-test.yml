name: Test Telegram notification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send test message to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret")
          url = "https://api.telegram.org/bot" + token + "/sendMessage"
          body = json.dumps({
              "chat_id": chat_id,
              "text": "✅ Prueba correcta: Bitget Volatility Radar puede enviarte alertas desde GitHub Actions."
          }).encode("utf-8")
          request = urllib.request.Request(
              url, data=body, headers={"Content-Type": "application/json"}, method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Telegram HTTP error: {exc.code}") from None
          if not payload.get("ok"):
              raise SystemExit("Telegram did not confirm delivery")
          print("Telegram API accepted test message successfully.")
          PY
